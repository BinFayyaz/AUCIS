
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/png" href="/aucis-mark.png" />
    <link rel="apple-touch-icon" href="/aucis-mark.png" />
    <meta
      name="description"
      content="AUCIS — the computing and innovation society of Air University, Kamra Campus. Workshops, competitions, tech talks and showcases."
    />
    <title>AUCIS — Air University Kamra</title>

    <script>
      try {
        const savedTheme = localStorage.getItem('aucis-theme')

        document.documentElement.dataset.theme =
          savedTheme === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
